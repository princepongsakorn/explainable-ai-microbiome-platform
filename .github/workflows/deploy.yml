# Test, then deploy to the application VM.
#
# On every push to main: run CI (ci.yml), then deploy only the parts the push
# changed.
#   kserve-custom-runtime/                          -> deployment/deploy_inference.sh
#   explainable-platform-service/, explainable-platform/,
#   docker-compose.prod.yml, deployment/nginx.conf  -> deployment/deploy_all.sh
# The Inference Service goes first, because a new Control Plane may call routes
# only the new runtime has.
#
# Run workflow deploys by hand: choose all, inference or app, and optionally a
# commit, tag or branch. Deploying an older commit is the rollback.
#
# A repository without DEPLOY_HOST set (a fresh fork, for example) only runs
# the tests. Setup for your own VM: deployment/README-github-actions.md.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, inference, app]
        default: all
      ref:
        description: Commit, tag or branch to deploy (an older commit rolls back). Empty means the branch chosen above.
        type: string
        default: ""

# One deploy at a time per repository. A deploy in progress is never cancelled;
# a newer one waits for it.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      enabled: ${{ steps.plan.outputs.enabled }}
      inference: ${{ steps.plan.outputs.inference }}
      app: ${{ steps.plan.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          inference=false; app=false
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$TARGET" in
              all) inference=true; app=true ;;
              inference) inference=true ;;
              app) app=true ;;
            esac
          else
            # Everything the push brought in, however many commits it was.
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then base="$BEFORE"; else base="HEAD~1"; fi
            files="$(git diff --name-only "$base" HEAD)"
            echo "Changed since ${base}:"; echo "$files"
            if grep -q '^kserve-custom-runtime/' <<<"$files"; then inference=true; fi
            if grep -qE '^(explainable-platform-service/|explainable-platform/|docker-compose\.prod\.yml$|deployment/nginx\.conf$)' <<<"$files"; then app=true; fi
          fi
          echo "inference=$inference" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"

          if [ -n "$DEPLOY_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy not configured::Tests run, nothing is deployed. Set the DEPLOY_HOST variable to deploy; see deployment/README-github-actions.md."
          fi
          echo "### Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$(git rev-parse --short HEAD)\` — inference: **$inference**, app: **$app**, deploy configured: **$([ -n "$DEPLOY_HOST" ] && echo yes || echo no)**" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}

  deploy-inference:
    name: Deploy Inference Service
    needs: [plan, ci]
    if: needs.plan.outputs.enabled == 'true' && needs.plan.outputs.inference == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: SSH access
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          INFERENCE_IMAGE: ${{ vars.INFERENCE_IMAGE }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deployment/ci_ssh_setup.sh
      - run: bash deployment/deploy_inference.sh

  deploy-app:
    name: Deploy Control Plane + web app
    needs: [plan, ci, deploy-inference]
    # After the inference deploy succeeded or was not needed.
    if: >-
      always() &&
      needs.plan.outputs.enabled == 'true' &&
      needs.plan.outputs.app == 'true' &&
      needs.ci.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.deploy-inference.result)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: SSH access
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          INFERENCE_IMAGE: ${{ vars.INFERENCE_IMAGE }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deployment/ci_ssh_setup.sh
      - run: bash deployment/deploy_all.sh
