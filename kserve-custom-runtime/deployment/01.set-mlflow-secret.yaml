# Credentials the inference service uses to reach MLflow and its artifact store.
# Fill in the placeholders, then apply:
#   kubectl apply -f 01.set-mlflow-secret.yaml
# Do not commit the filled-in copy. `stringData` takes plain values;
# Kubernetes base64-encodes them on apply.
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secret
type: Opaque
stringData:
  MLFLOW_URL: "http://<mlflow-host>:5000"
  MLFLOW_TRACKING_USERNAME: "<mlflow-username>"
  MLFLOW_TRACKING_PASSWORD: "<mlflow-password>"
  # Only needed when MLflow stores artifacts in S3.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: ""
