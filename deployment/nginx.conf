# nginx reverse proxy for VM #2
#
# Layout:
#   /              → frontend (Next.js, port 3001)
#   /api/*         → backend  (NestJS, port 3000)
#   /_next/*       → frontend (Next.js static + HMR assets)
#
# Inference (port 8080) is NOT exposed publicly — backend reaches it via host.docker.internal:8080.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/platform
#   sudo ln -sf /etc/nginx/sites-available/platform /etc/nginx/sites-enabled/platform
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# Upstream definitions — keep names symbolic so we can rebind ports later.
upstream backend_upstream {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream frontend_upstream {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Bigger client_max for CSV uploads (predictions accept CSVs)
    client_max_body_size 25m;

    # Proxy timeouts — SHAP plots can take a while
    proxy_connect_timeout 30s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # Common proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # ---------------- /api/* → NestJS ----------------
    location /api/ {
        proxy_pass http://backend_upstream;
    }

    # ---------------- Next.js internals ----------------
    location /_next/ {
        proxy_pass http://frontend_upstream;
        # Cache built static assets aggressively (filenames are content-hashed)
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ---------------- Everything else → Next.js ----------------
    location / {
        proxy_pass http://frontend_upstream;
    }
}
